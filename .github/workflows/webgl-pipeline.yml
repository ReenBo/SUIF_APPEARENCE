name: WebGL Build & Deploy Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Architecture & Security Audit
    runs-on: windows-latest
    steps:
      - name: Checkout SUIF_APPEARENCE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CI Audits
        shell: powershell
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          .\.agents\ci\run-all-checks.ps1 -ProjectPath .

  build-and-deploy:
    name: Build WebGL & Deploy
    needs: [audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SUIF_APPEARENCE
        uses: actions/checkout@v4
        with:
          path: SUIF_APPEARENCE
          submodules: recursive

      - name: Checkout SUIF Framework
        uses: actions/checkout@v4
        with:
          repository: ReenBo/SUIF
          path: SUIF
          token: ${{ secrets.GH_PAT_SUIF || secrets.GITHUB_TOKEN }}

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: SUIF_APPEARENCE/Library
          key: Library-WebGL-${{ hashFiles('SUIF_APPEARENCE/Assets/**', 'SUIF_APPEARENCE/Packages/**', 'SUIF/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL via GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: SUIF_APPEARENCE
          targetPlatform: WebGL
          buildMethod: SUIF.Editor.Build.WebGLBuilder.BuildFromCommandLine
          customParameters: -outputFolder Builds/WebGL

      - name: Prepare & Verify WebGL Build Directory
        run: |
          echo "=== Locating WebGL Build Output ==="
          if [ -d "${{ github.workspace }}/SUIF_APPEARENCE/Builds/WebGL" ]; then
            echo "Found build in SUIF_APPEARENCE/Builds/WebGL"
            mkdir -p ${{ github.workspace }}/Builds
            cp -r ${{ github.workspace }}/SUIF_APPEARENCE/Builds/WebGL ${{ github.workspace }}/Builds/
          elif [ -d "${{ github.workspace }}/build/WebGL/WebGL" ]; then
            echo "Found build in build/WebGL/WebGL"
            mkdir -p ${{ github.workspace }}/Builds
            mkdir -p ${{ github.workspace }}/SUIF_APPEARENCE/Builds
            cp -r ${{ github.workspace }}/build/WebGL/WebGL ${{ github.workspace }}/Builds/
            cp -r ${{ github.workspace }}/build/WebGL/WebGL ${{ github.workspace }}/SUIF_APPEARENCE/Builds/
          fi
          echo "Listing ${{ github.workspace }}/Builds/WebGL:"
          ls -la ${{ github.workspace }}/Builds/WebGL || find ${{ github.workspace }} -name "index.html"

      - name: Deploy to Cloudflare Workers Static Assets
        id: cloudflare_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: SUIF_APPEARENCE
        run: |
          npx -y wrangler deploy

      - name: Deploy to Itch.io (Release Tags Only)
        if: startsWith(github.ref, 'refs/tags/v') && env.BUTLER_CREDENTIALS != ''
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_BUTLER_TOKEN }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler push ${{ github.workspace }}/Builds/WebGL reenbo/suif-appearance:html5

  benchmark-performance:
    name: Headless WebGL Performance Benchmark
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run WebGL Stress Benchmark
        env:
          WEBGL_URL: "https://suif-showcase.covenant-rimless194.workers.dev/?autotest=true"
        run: |
          npx playwright test -c tests/e2e/playwright.config.js tests/e2e/benchmark.spec.js
